name: MLOps CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  validate-train-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Train models and create reusable artifact
        run: python -m src.heart_disease_mlops.train

      - name: Unit tests and coverage
        run: |
          pytest -q --junitxml=reports/pytest.xml \
            --cov=src --cov-report=term-missing --cov-report=xml:reports/coverage.xml

      - name: Build Docker image
        run: docker build -t heart-disease-api:ci .

      - name: Smoke-test Docker container
        run: |
          docker run -d --name heart-disease-api-ci -p 8000:8000 heart-disease-api:ci
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/metrics | grep -q 'model_loaded'
          docker logs heart-disease-api-ci
          docker rm -f heart-disease-api-ci

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlops-ci-artifacts
          path: |
            artifacts/model.pkl
            artifacts/model_metadata.json
            artifacts/model_comparison.csv
            mlflow.db
            reports/pytest.xml
            reports/coverage.xml
          if-no-files-found: warn
